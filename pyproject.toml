[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demandcast"
version = "1.0.0"
description = "Demand forecasting: global gradient-boosting forecaster with seasonal baselines, rolling-origin backtests and conformal-calibrated prediction intervals."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["time-series", "forecasting", "demand-forecasting", "conformal-prediction", "fastapi"]
dependencies = ["numpy>=1.26", "scikit-learn>=1.4", "pandas>=2.1", "matplotlib>=3.8", "joblib>=1.3", "PyYAML>=6.0"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7"]

[project.scripts]
demandcast = "demandcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
demandcast = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
